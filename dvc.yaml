# DVC pipeline for the readmission project. Each stage lists what it reads (deps),
# the command to run, and what it writes (outs). `dvc repro` runs only the stages
# whose inputs changed since the last run.
#
# Every output has cache: false. DVC still records its hash in dvc.lock, but the file
# itself is committed to Git, so a clone from GitHub has the data, model and reports
# without a DVC remote.
#
# approve, predict, serve and monitor are not here. They need a person or a new-patients file.
#
# answers_evidence reads the files the other stages write, so it runs last. It also
# reads mlflow.db and the Git history, which DVC does not track. If only those
# changed, DVC will skip it. Use `dvc repro --force answers_evidence` to refresh it.

stages:
  ingest:
    cmd: python -m src.ingest
    deps:
      - data/raw/synthetic_clinical_dataset.csv
      - config.yaml
      - src/ingest.py
      - src/display.py
      - src/config.py
    outs:
      - data/processed/clean_synthetic_clinical_dataset.csv:
          cache: false
      - data/new/new_synthetic_clinical_dataset.csv:
          cache: false
      - data/new/new_synthetic_clinical_dataset_answers.csv:
          cache: false
      - reports/ingest_output.rtf:
          cache: false

  validate:
    cmd: python -m src.validate
    deps:
      - data/processed/clean_synthetic_clinical_dataset.csv
      - config.yaml
      - src/validate.py
      - src/config.py
      - src/display.py
      - src/ingest.py
    outs:
      - reports/validate_output.rtf:
          cache: false

  train:
    cmd: python -m src.train
    deps:
      - data/processed/clean_synthetic_clinical_dataset.csv
      - config.yaml
      - src/train.py
      - src/features.py
      - src/validate.py
      - src/config.py
      - src/display.py
      - src/ingest.py
      - src/tracking.py
    outs:
      - artifacts/model.joblib:
          cache: false
      - artifacts/model_card.json:
          cache: false
      - data/processed/features.csv:
          cache: false
      - reports/train_output.rtf:
          cache: false

  evaluate:
    cmd: python -m src.evaluate
    deps:
      - data/processed/clean_synthetic_clinical_dataset.csv
      - artifacts/model.joblib
      - config.yaml
      - src/evaluate.py
      - src/features.py
      - src/config.py
      - src/display.py
      - src/ingest.py
      - src/tracking.py
      - src/train.py
      - src/validate.py
    metrics:
      - reports/metrics.json:
          cache: false
    outs:
      - reports/evaluate_output.rtf:
          cache: false

  compare:
    cmd: python -m src.compare
    deps:
      - data/processed/clean_synthetic_clinical_dataset.csv
      - config.yaml
      - src/compare.py
      - src/train.py
      - src/features.py
      - src/evaluate.py
      - src/config.py
      - src/display.py
      - src/ingest.py
      - src/tracking.py
      - src/validate.py
    outs:
      - reports/model_comparison.csv:
          cache: false
      - reports/evaluation_evidence.md:
          cache: false
      - reports/compare_output.rtf:
          cache: false

  plots:
    cmd: python -m src.plots
    deps:
      - data/processed/clean_synthetic_clinical_dataset.csv
      - artifacts/model.joblib
      - config.yaml
      - src/plots.py
      - src/evaluate.py
      - src/train.py
      - src/features.py
      - src/config.py
      - src/display.py
      - src/ingest.py
      - src/tracking.py
      - src/validate.py
    outs:
      - reports/figures:
          cache: false
      - reports/plots_output.rtf:
          cache: false

  answers_evidence:
    cmd: python -m src.answers_evidence
    deps:
      - data/raw/synthetic_clinical_dataset.csv
      - data/processed/clean_synthetic_clinical_dataset.csv
      - artifacts/model.joblib
      - artifacts/model_card.json
      - reports/model_comparison.csv
      - reports/figures
      - config.yaml
      - src/answers_evidence.py
      - src/evaluate.py
      - src/train.py
      - src/features.py
      - src/config.py
      - src/display.py
      - src/ingest.py
      - src/tracking.py
      - src/validate.py
    outs:
      - reports/answer_evidence_output.rtf:
          cache: false
