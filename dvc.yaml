# DVC pipeline for the readmission project. Each stage lists what it reads (deps),
# the command to run, and what it writes (outs). `dvc repro` runs only the stages
# whose inputs changed since the last run.
#
# predict is not here because it needs a new-patients file that you create.

stages:
  ingest:
    cmd: python -m src.ingest
    deps:
      - data/raw/synthetic_clinical_dataset.csv
      - config.yaml
      - src/ingest.py
      - src/display.py
      - src/config.py
    outs:
      - data/processed/clean_synthetic_clinical_dataset.csv
      - data/new/new_synthetic_clinical_dataset.csv
      - data/new/new_synthetic_clinical_dataset_answers.csv
      - reports/ingest_output.rtf

  validate:
    cmd: python -m src.validate
    deps:
      - data/processed/clean_synthetic_clinical_dataset.csv
      - config.yaml
      - src/validate.py
      - src/config.py
      - src/display.py
      - src/ingest.py
    outs:
      - reports/validate_output.rtf

  train:
    cmd: python -m src.train
    deps:
      - data/processed/clean_synthetic_clinical_dataset.csv
      - config.yaml
      - src/train.py
      - src/features.py
      - src/validate.py
      - src/config.py
      - src/display.py
      - src/ingest.py
      - src/tracking.py
    outs:
      - artifacts/model.joblib
      - artifacts/model_card.json
      - data/processed/features.csv
      - reports/train_output.rtf

  evaluate:
    cmd: python -m src.evaluate
    deps:
      - data/processed/clean_synthetic_clinical_dataset.csv
      - artifacts/model.joblib
      - config.yaml
      - src/evaluate.py
      - src/features.py
      - src/config.py
      - src/display.py
      - src/ingest.py
      - src/tracking.py
      - src/train.py
      - src/validate.py
    metrics:
      - reports/metrics.json
    outs:
      - reports/evaluate_output.rtf

  compare:
    cmd: python -m src.compare
    deps:
      - data/processed/clean_synthetic_clinical_dataset.csv
      - config.yaml
      - src/compare.py
      - src/train.py
      - src/features.py
      - src/evaluate.py
      - src/config.py
      - src/display.py
      - src/ingest.py
      - src/tracking.py
      - src/validate.py
    outs:
      - reports/model_comparison.csv
      - reports/evaluation_evidence.md
      - reports/compare_output.rtf

  plots:
    cmd: python -m src.plots
    deps:
      - data/processed/clean_synthetic_clinical_dataset.csv
      - artifacts/model.joblib
      - config.yaml
      - src/plots.py
      - src/evaluate.py
      - src/train.py
      - src/features.py
      - src/config.py
      - src/display.py
      - src/ingest.py
      - src/tracking.py
      - src/validate.py
    outs:
      - reports/figures
      - reports/plots_output.rtf
